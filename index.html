        async function fetchGeminiWithFallback(contents, systemText, customApiKey, preferredModel) {
            const browserKey = (customApiKey && customApiKey.trim()) ? customApiKey.trim() : '';
            const activeKey = browserKey || SERVER_ENV_KEY;

            if (!activeKey) {
                throw new Error('API Key Gemini belum disetel. Masukkan lewat tombol "🔑 API Key" di kanan atas atau atur GEMINI_API_KEY di Environment Variables Vercel.');
            }

            const primary = (preferredModel && preferredModel.trim()) ? preferredModel.trim() : (SERVER_ENV_MODEL || 'gemini-3.8-flash');

            const candidateModels = [
                primary,
                ...FALLBACK_GEMINI_MODELS.filter(m => m !== primary)
            ];

            let lastError = null;

            for (let mIdx = 0; mIdx < candidateModels.length; mIdx++) {
                const modelName = candidateModels[mIdx];
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${activeKey}`;

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents,
                            systemInstruction: { parts: [{ text: systemText }] }
                        })
                    });

                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        const errMsg = errData?.error?.message || `HTTP ${res.status}`;
                        lastError = new Error(errMsg);
                        // Automatically try the next model in FALLBACK_GEMINI_MODELS
                        continue;
                    }

                    const data = await res.json();
                    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (reply) return reply;
                } catch (err) {
                    lastError = err;
                }
            }

            throw lastError || new Error('Gagal menghubungi server Gemini API.');
        }

        function computeWaypoints(curFloor, curX, curZ, targetFloor, targetX, targetZ) {
            const waypoints = [];
            if (curFloor !== targetFloor) {
                // Grand Staircase at X: -3.5, Z: 11.5
                waypoints.push({ floor: curFloor, x: -3.5, z: 11.0 });
                waypoints.push({ floor: targetFloor, x: -3.5, z: 9.8 });
            }
            if (Math.hypot(targetX - curX, targetZ - curZ) > 7.5) {
                waypoints.push({ floor: targetFloor, x: (curX + targetX) * 0.35, z: -1.2 });
            }
            waypoints.push({ floor: targetFloor, x: targetX, z: targetZ });
            return waypoints;
        }

                const stage = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.2, 3.2), new THREE.MeshStandardMaterial({ color: 0x78350f }));

                cafeBar.position.set(10.0, 0.58, 3.0);

                floor2Group.add(stage, cafeBar, lesehan, hammock);

                skyRefs.current = { hemi, dirLight, sunGroup, moonGroup, starsMesh, cloudsGroup, cloudMats, nightLights };

                // ====================================================================
                // REAL-TIME ANIMATION LOOP (DYNAMIC FPS CAP, LIVE FPS COUNTER & 19 AGENTS)
                // ====================================================================
                const clock = new THREE.Clock();
                let frameId;
                let timeAccumulator = 0;
                let fpsFrames = 0;
                let fpsTimer = 0;

                const animate = () => {
                    frameId = requestAnimationFrame(animate);

                    const rawDelta = clock.getDelta();
                    timeAccumulator += rawDelta;

                    const gfx = stateRef.current.graphicsSettings || DEFAULT_GRAPHICS;
                    const targetCap = gfx.targetFPS || 30;
                    const frameInterval = 1 / targetCap;

                    if (timeAccumulator < frameInterval) return;

                    const dt = Math.min(timeAccumulator, 0.1);
                    timeAccumulator = timeAccumulator % frameInterval;
                    const elapsed = clock.getElapsedTime();

                    // Calculate Live FPS Counter for Top Bar
                    fpsFrames++;
                    fpsTimer += dt;
                    if (fpsTimer >= 0.75) {
                        const measuredFps = Math.min(60, Math.round(fpsFrames / fpsTimer));
                        if (onFpsUpdate) onFpsUpdate(measuredFps);
                        fpsFrames = 0;
                        fpsTimer = 0;
                    }

                    controls.update();

                    // Gently drift 3D clouds across the sky (only if skyEffects ON)
                    if (gfx.skyEffects && skyRefs.current.cloudsGroup) {
                        skyRefs.current.cloudsGroup.children.forEach(cl => {

                            if (cl.position.x > 70) cl.position.x = -70;

                    }

                    // Subtle star twinkle at night
                    if (gfx.skyEffects && skyRefs.current.starsMesh && skyRefs.current.starsMesh.visible) {
                        skyRefs.current.starsMesh.rotation.y = elapsed * 0.008;

                    const {
                        agents: currAgents,

                    } = stateRef.current;
                    const rigs = rigsRef.current;

                    currAgents.forEach((ag, idx) => {
                        if (stateRef.current.simulationPaused) return;
                        let target = getAgentTarget(ag, idx, currAgents, sMode, lMode, iTick);

                        if (!rigs[ag.id]) {
                            const built = buildCharacterAvatar(ag);

                            built.root.rotation.y = target.ry;
                            scene.add(built.root);

                            const bubbleEl = document.createElement('div');
                            bubbleEl.className = 'agent-bubble absolute z-10 cursor-pointer';
                            bubbleEl.onclick = () => onSelectAgent(ag.id);
                            if (labelsRef.current) labelsRef.current.appendChild(bubbleEl);

                            rigs[ag.id] = {
                                ...built,
                                currentFloor: target.floor,
                                waypoints: [],
                                targetKey: `${target.floor}:${target.x.toFixed(1)},${target.z.toFixed(1)}`,
                                walkPhase: idx * 0.9,
                                bubbleEl,
                                lastHtmlKey: '',
                                autoTarget: null,
                                nextAutoAt: elapsed + 5 + Math.random() * 12,
                                holdUntil: 0,
                                autoVisitCount: 0
                            };
                        }

                        const r = rigs[ag.id];

                        // Autonomous office life: agents periodically choose a real destination,

                        // Meetings and sleep mode keep their explicit commanded destinations.
                        const canWander = !sMode && !ag.manualDestination && ag.state !== 'Meeting' && ag.state !== 'Collaborating';
                        if (canWander && r.autoTarget) {
                            const atGoal = r.waypoints.length === 0 &&
                                r.currentFloor === r.autoTarget.floor &&
                                Math.hypot(r.root.position.x - r.autoTarget.x, r.root.position.z - r.autoTarget.z) < 0.38;
                            if (atGoal && !r.holdUntil) r.holdUntil = elapsed + 5 + Math.random() * 9;
                            if (atGoal && elapsed >= r.holdUntil) {
                                r.autoTarget = null;
                                r.holdUntil = 0;
                                r.nextAutoAt = elapsed + 7 + Math.random() * 15;
                            }
                        }

                        if (canWander && !r.autoTarget && elapsed >= r.nextAutoAt) {
                            // Working agents take short breaks around the first-floor office;
                            // idle agents can explore both floors and the outdoor recreation area.
                            const candidates = (ag.state === 'Idle' ? LOUNGE_AND_IDLE_SPOTS : LOUNGE_AND_IDLE_SPOTS.filter(spot => spot.floor === 1))
                                .filter(spot => spot.id !== 'smoking_room' || ag.gender === 'male')
                                .filter(spot => spot.id !== 'toilet_male' || ag.gender === 'male')
                                .filter(spot => spot.id !== 'toilet_female' || ag.gender === 'female');
                            const choices = candidates.filter(spot => {
                                const sameAsCurrent = spot.floor === r.currentFloor &&
                                    Math.hypot(spot.x - r.root.position.x, spot.z - r.root.position.z) < 3.2;
                                const sameAsDesk = spot.floor === target.floor &&
                                    Math.hypot(spot.x - target.x, spot.z - target.z) < 2.2;
                                return !sameAsCurrent && !sameAsDesk;
                            });
                            const pool = choices.length ? choices : candidates;
                            const pick = pool[Math.floor(Math.random() * pool.length)];
                            if (pick) {
                                const spread = ((idx % 3) - 1) * 0.48;
                                r.autoTarget = {
                                    floor: pick.floor,
                                    x: pick.x + spread,
                                    z: pick.z + ((idx % 2) ? 0.28 : -0.28),
                                    ry: pick.ry,
                                    posture: pick.posture,
                                    roomLabel: pick.label,
                                    bubble: `🎯 Tujuan: ${pick.label}`
                                };
                                r.autoVisitCount++;
                                r.holdUntil = 0;
                            }
                        }
                        if (canWander && r.autoTarget) target = r.autoTarget;

                        const nextKey = `${target.floor}:${target.x.toFixed(1)},${target.z.toFixed(1)}`;
                        if (r.targetKey !== nextKey) {
                            r.targetKey = nextKey;
                            r.waypoints = computeWaypoints(r.currentFloor, r.root.position.x, r.root.position.z, target.floor, target.x, target.z);
                        }

                        const visibleOnCurrentFloor = aFloor === 1 ? (r.currentFloor === 1) : (r.currentFloor === 2);
                        r.root.visible = visibleOnCurrentFloor;

                        if (r.waypoints.length > 0) {
                            const wp = r.waypoints[0];
                            r.currentFloor = wp.floor;
                            const desiredY = wp.floor === 2 ? 3.92 : 0.14;
                            const dx = wp.x - r.root.position.x;
                            const dz = wp.z - r.root.position.z;
                            const dist = Math.hypot(dx, dz);

                            if (dist > 0.16) {
                                const moveStep = 4.6 * dt;
                                r.root.position.x += (dx / dist) * Math.min(moveStep, dist);
                                r.root.position.z += (dz / dist) * Math.min(moveStep, dist);
                                r.root.position.y += (desiredY - r.root.position.y) * 0.2;
                                r.root.rotation.y = Math.atan2(dx, dz);

                                r.walkPhase += dt * 11;
                                const sw = Math.sin(r.walkPhase) * 0.65;
                                r.leftLegPivot.rotation.x = sw;
                                r.rightLegPivot.rotation.x = -sw;
                                r.leftArmPivot.rotation.x = -sw * 0.75;
                                r.rightArmPivot.rotation.x = sw * 0.75;
                                r.bodyGroup.position.y = 0.62 + Math.abs(Math.cos(r.walkPhase * 2)) * 0.04;

                            } else {
                                r.waypoints.shift();
                            }
                        } else {

                            let angleDiff = target.ry - r.root.rotation.y;

                            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                            r.root.rotation.y += angleDiff * 0.22;

                            if (target.posture === 'sleep') {

                                r.rightLegPivot.rotation.x = 0;
                                r.leftArmPivot.rotation.x = 0;
                                r.rightArmPivot.rotation.x = 0;

                                r.bodyGroup.rotation.x = 0;
                                r.bodyGroup.position.y = 0.46;

                                r.rightLegPivot.rotation.x = -Math.PI / 2.2;
                                if (ag.state === 'Working' || ag.state === 'Thinking') {
                                    r.leftArmPivot.rotation.x = -0.85 + Math.sin(elapsed * 15 + idx) * 0.16;
                                    r.rightArmPivot.rotation.x = -0.85 + Math.cos(elapsed * 15 + idx) * 0.16;
                                    r.headGroup.rotation.y = Math.sin(elapsed * 2.2 + idx) * 0.10;
                                } else {
                                    r.leftArmPivot.rotation.x = -0.5;
                                    r.rightArmPivot.rotation.x = -0.5;
                                    r.headGroup.rotation.y = 0;
                                }
                            } else {
                                r.root.position.y = baseY;
                                r.bodyGroup.rotation.x = 0;
                                r.bodyGroup.position.y = 0.62;
                                r.leftLegPivot.rotation.x = 0;
                                r.rightLegPivot.rotation.x = 0;
                                r.leftArmPivot.rotation.x = Math.sin(elapsed * 2 + idx) * 0.08;
                                r.rightArmPivot.rotation.x = -Math.sin(elapsed * 2 + idx) * 0.08;
                            }
                        }

                        if (ag.id === 'nadzar-ceo' && ag.swingUntil && ag.swingUntil > Date.now()) { r.rightArmPivot.rotation.x = -2.35; r.rightArmPivot.rotation.z = -0.75; }
                        if (ag.coffeeUntil && ag.coffeeUntil > Date.now()) { r.rightArmPivot.rotation.x = -1.35 + Math.sin(elapsed * 5) * 0.08; r.rightArmPivot.rotation.z = -0.18; }
                        if (ag.dizzyUntil && ag.dizzyUntil > Date.now()) {
                            r.headGroup.rotation.z = Math.sin(elapsed * 15) * 0.32;
                            r.root.rotation.y += Math.sin(elapsed * 11) * 0.06;
                            r.bodyGroup.rotation.z = Math.sin(elapsed * 13) * 0.08;

                        if (agentPositionsRef && agentPositionsRef.current) {
                            agentPositionsRef.current[ag.id] = { x: r.root.position.x, z: r.root.position.z, floor: r.currentFloor };

                                    r.bubbleEl.style.pointerEvents = 'auto';
                                    r.bubbleEl.style.left = `${sx}px`;

                                        r.bubbleEl.innerHTML = `

                    if (moves[key]) { e.preventDefault(); nudgeCEO(...moves[key]); }

                    else if (key === '1') setActiveFloor(1);

                                                    graphicsSettings.preset === pr.preset
                                                        ? 'bg-purple-600/25 border-purple-400 text-white shadow'
                                                        : 'bg-slate-950 border-slate-800 text-slate-400 hover:bg-slate-800'
                                                }`}
                                            >
                                                <div className="font-bold text-xs">{pr.label.split('(')[0]}</div>
                                                <div className="text-[10px] opacity-80">
                                                    Res {pr.resolutionScale}x • {pr.targetFPS} FPS • Shadow {pr.shadows ? 'ON' : 'OFF'}
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Custom Sliders & Toggles */}
                                <div className="space-y-3 pt-2 border-t border-slate-800">
                                    <div className="flex items-center justify-between gap-2">
                                        <div>
                                            <div className="font-semibold text-slate-200">Skala Resolusi Render (Pixel Ratio)</div>
                                            <div className="text-[10px] text-slate-400">Turunkan ke 0.75x atau 1.0x agar super enteng di layar tajam.</div>
                                        </div>
                                        <select
                                            value={graphicsSettings.resolutionScale}
                                            onChange={e => updateGraphics({ preset: 'custom', resolutionScale: parseFloat(e.target.value) })}
                                            className="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono text-cyan-300"
                                        >
                                            <option value={0.5}>0.5x (Ultra Cepat)</option>
                                            <option value={0.75}>0.75x (Hemat GPU)</option>
                                            <option value={1.0}>1.0x (Standar Anti-Lag)</option>
                                            <option value={1.25}>1.25x (Tajam HD)</option>
                                            <option value={1.75}>1.75x (Ultra Retina)</option>
                                        </select>
                                    </div>

                                    <div className="flex items-center justify-between gap-2">
                                        <div>
                                            <div className="font-semibold text-slate-200">Batas Kecepatan Frame (Target FPS Cap)</div>
                                            <div className="text-[10px] text-slate-400">30 FPS menjaga suhu laptop/HP tetap dingin & stabil.</div>
                                        </div>
                                        <select
                                            value={graphicsSettings.targetFPS}
                                            onChange={e => updateGraphics({ preset: 'custom', targetFPS: parseInt(e.target.value, 10) })}
                                            className="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono text-emerald-300"
                                        >
                                            <option value={24}>24 FPS (Cinematic Hemat)</option>
                                            <option value={30}>30 FPS (Stabil Rekomendasi)</option>
                                            <option value={45}>45 FPS (Smooth)</option>
                                            <option value={60}>60 FPS (Maksimal)</option>
                                        </select>
                                    </div>

                                    <div className="flex items-center justify-between gap-2">
                                        <div>
                                            <div className="font-semibold text-slate-200">Kepadatan Pohon & Penghijauan Taman</div>
                                            <div className="text-[10px] text-slate-400">Mengatur jumlah pohon & bunga yang dirender di sekeliling gedung.</div>
                                        </div>
                                        <select
                                            value={graphicsSettings.foliageDensity}
                                            onChange={e => updateGraphics({ preset: 'custom', foliageDensity: e.target.value })}
                                            className="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono text-green-300"
                                        >
                                            <option value="minimal">Minimal (8 Pohon)</option>
                                            <option value="medium">Sedang (20 Pohon)</option>
                                            <option value="full">Penuh Rindang (42 Pohon & Bunga)</option>
                                        </select>
                                    </div>

                                    <div className="flex items-center justify-between gap-2">
                                        <div>
                                            <div className="font-semibold text-slate-200">Label Nama Melayang di Atas Kepala Agent</div>
                                            <div className="text-[10px] text-slate-400">Pilih "Saat Dipilih" jika layar HP terasa penuh atau berat.</div>
                                        </div>
                                        <select
                                            value={graphicsSettings.labelMode}
                                            onChange={e => updateGraphics({ preset: 'custom', labelMode: e.target.value })}
                                            className="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono text-amber-300"
                                        >
                                            <option value="all">Tampilkan Semua (19 Agent)</option>
                                            <option value="selected">Saat Agent Dipilih Saja (Hemat DOM)</option>
                                            <option value="none">Sembunyikan Semua</option>
                                        </select>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2 pt-1">
                                        <button
                                            onClick={() => updateGraphics({ preset: 'custom', shadows: !graphicsSettings.shadows })}
                                            className={`p-2.5 rounded-xl border font-semibold flex items-center justify-between ${
                                                graphicsSettings.shadows
                                                    ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300'
                                                    : 'bg-slate-950 border-slate-800 text-slate-400'
                                            }`}
                                        >
                                            <span>☀️ Bayangan (Shadows)</span>
                                            <span className="font-mono">{graphicsSettings.shadows ? 'ON' : 'OFF'}</span>
                                        </button>

                                        <button
                                            onClick={() => updateGraphics({ preset: 'custom', skyEffects: !graphicsSettings.skyEffects })}
                                            className={`p-2.5 rounded-xl border font-semibold flex items-center justify-between ${
                                                graphicsSettings.skyEffects
                                                    ? 'bg-sky-500/20 border-sky-500/50 text-sky-300'
                                                    : 'bg-slate-950 border-slate-800 text-slate-400'
                                            }`}
                                        >
                                            <span>☁️ Awan & Bintang</span>
                                            <span className="font-mono">{graphicsSettings.skyEffects ? 'ON' : 'OFF'}</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="flex justify-end pt-2">
                                    <button
                                        onClick={() => setShowGraphicsModal(false)}
                                        className="px-5 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold"
                                    >
                                        Selesai & Terapkan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ================================================================ */}
                    {/* MODAL 1: GOOGLE AI STUDIO API KEY & MODEL SELECTOR               */}
                    {/* ================================================================ */}
                    {showApiModal && (
                        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-5 space-y-4 text-xs shadow-2xl">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <h3 className="font-bold text-sm flex items-center gap-2 text-emerald-400">
                                        🔑 Hubungkan API Key & Pilih Model Gemini
                                    </h3>
                                    <button onClick={() => setShowApiModal(false)} className="p-1 rounded hover:bg-slate-800">
                                        <Icon name="x" className="w-4 h-4" />
                                    </button>
                                </div>

                                <div className="space-y-1.5">
                                    <label className="font-semibold text-slate-200 block">1. Gemini API Key (<code className="text-sky-400">aistudio.google.com</code>):</label>
                                    <input
                                        type="password"
                                        value={customApiKey}
                                        onChange={e => setCustomApiKey(e.target.value)}
                                        placeholder="AIzaSy..."
                                        className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 font-mono text-xs"
                                    />
                                </div>

                                <div className="space-y-1.5">
                                    <label className="font-semibold text-slate-200 block">2. Pilih Model Gemini Utama (Otomatis Fallback jika Limit):</label>
                                    <select
                                        value={preferredModel}
                                        onChange={e => setPreferredModel(e.target.value)}
                                        className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 font-mono text-xs text-cyan-300"
                                    >
                                        <option value="gemini-3.8-flash">gemini-3.8-flash (Terbaru - Rekomendasi Google AI Studio)</option>
                                        <option value="gemini-3-flash-preview">gemini-3-flash-preview (Cepat & Ringan)</option>
                                        <option value="gemini-2.0-flash">gemini-2.0-flash (Alternatif Stabil)</option>
                                        <option value="gemini-1.5-flash">gemini-1.5-flash (Legacy Flash)</option>
                                    </select>
                                    <p className="text-[10px] text-slate-400">
                                        💡 Sistem otomatis mencoba model cadangan apabila model utama yang dipilih sedang penuh atau tidak tersedia untuk akunmu.
                                    </p>
                                </div>

                                <div className="flex justify-end gap-2 pt-2">
                                    <button
                                        onClick={() => saveApiKey('', 'gemini-3.8-flash')}
                                        className="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300"
                                    >
                                        Reset Default
                                    </button>
                                    <button
                                        onClick={() => saveApiKey(customApiKey, preferredModel)}
                                        className="px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold"
                                    >
                                        Simpan & Aktifkan 19 Agent
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ================================================================ */}
                    {/* MODAL 2: STEP-BY-STEP VERCEL DEPLOYMENT GUIDE                    */}
                    {/* ================================================================ */}
                    {showVercelModal && (
                        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="w-full max-w-2xl bg-slate-900 border border-slate-700 rounded-2xl p-6 space-y-4 text-xs shadow-2xl max-h-[88vh] overflow-y-auto">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <h3 className="font-bold text-base text-sky-400">
                                        🚀 Tata Cara Publish Kantor 19 Agent Nadzar ke Vercel (Gratis Rp 0)
                                    </h3>
                                    <button onClick={() => setShowVercelModal(false)} className="p-1 rounded hover:bg-slate-800">
                                        <Icon name="x" className="w-4 h-4" />
                                    </button>
                                </div>

                                <div className="space-y-3 text-slate-200 leading-relaxed">
                                    <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-1.5">
                                        <div className="font-bold text-emerald-400">Cara 1: Langsung Upload File Ini (Paling Cepat - 2 Menit!)</div>
                                        <ol className="list-decimal list-inside space-y-1 text-slate-300">
                                            <li>Simpan kode aplikasi ini ke sebuah folder di laptopmu dengan nama file <b><code>index.html</code></b>.</li>
                                            <li>Buka GitHub.com, buat repository baru (misal: <code>aica-nadzar-office</code>), lalu upload file <code>index.html</code> tersebut.</li>
                                            <li>Buka <b>vercel.com</b> → Login pakai akun GitHub kamu → Klik <b>Add New Project</b> → Pilih repo <code>aica-nadzar-office</code>.</li>
                                            <li>Klik <b>Deploy</b>! Dalam 30 detik, web kamu langsung live (misal: <code>aica-nadzar-office.vercel.app</code>).</li>
                                            <li>Buka link Vercel-nya, klik tombol <b>🔑 Set Gemini API Key</b> di pojok kanan atas, masukkan API Key Google AI Studio kamu, dan langsung mainkan!</li>
                                        </ol>
                                    </div>

                                    <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-1.5">
                                        <div className="font-bold text-sky-400">Cara 2: Pakai Next.js + Environment Variable Server (Tanpa Input Key di Browser)</div>
                                        <p className="text-slate-400">Kalau kamu ingin API Key langsung ditanam di server Vercel agar tidak perlu mengetik ulang saat ganti HP/laptop:</p>
                                        <pre className="p-3 rounded-lg bg-slate-900 border border-slate-800 font-mono text-[11px] overflow-x-auto text-cyan-300">{`npx create-next-app@latest aica-nadzar
cd aica-nadzar
npm install three lucide-react @google/genai
git add . && git commit -m "init 19 agents office"
git push origin main`}</pre>
                                        <p className="text-slate-300">
                                            Lalu di dashboard <b>Vercel → Settings → Environment Variables</b>, tambahkan:
                                            <br />Nama: <code className="text-amber-300">GEMINI_API_KEY</code> | Value: <code className="text-emerald-300">AIzaSy_Key_Google_AI_Studio_Kamu</code>.
                                        </p>
                                    </div>

                                    <div className="p-3.5 rounded-xl bg-indigo-950/40 border border-indigo-500/30 space-y-1">
                                        <div className="font-bold text-indigo-300">💡 Tips Hemat Kuota Gemini Gratis:</div>
                                        <p className="text-slate-300">
                                            Aplikasi ini sudah diset menggunakan model <b><code>gemini-2.5-flash</code></b> yang punya batas kuota gratis harian besar di Google AI Studio. Animasi jalan-jalan 3D dihitung 100% oleh prosesor browser (Three.js), sehingga <b>tidak memakan kuota token AI</b> kecuali saat kamu benar-benar mengirim chat ke agen!
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
